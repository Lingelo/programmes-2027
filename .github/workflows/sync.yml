name: Synchro quotidienne (Wikipédia + parrainages)

on:
  schedule:
    - cron: "17 5 * * *"    # tous les jours vers 6h-7h (heure de Paris)
    - cron: "23 18 * * *"   # et en soirée, après les publications du Conseil constitutionnel
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Synchroniser candidats et photos
        run: node scripts/sync-wikipedia.mjs
      - name: Parrainages (Conseil constitutionnel)
        run: node scripts/sync-parrainages.mjs
      - name: Vérifier les données
        run: node scripts/check-data.mjs
      - name: Commit
        run: |
          git config user.name "programmes-2027-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ img/
          git diff --cached --quiet || git commit -m "Synchro Wikipédia et parrainages du $(date -u +%F)"
          git push

  deploy:
    needs: sync
    uses: ./.github/workflows/deploy.yml
