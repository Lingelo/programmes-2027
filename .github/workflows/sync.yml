name: Synchro quotidienne (Wikipédia + parrainages)

on:
  schedule:
    - cron: "17 5 * * *"    # tous les jours vers 6h-7h (heure de Paris)
    - cron: "23 18 * * *"   # et en soirée, après les publications du Conseil constitutionnel
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Synchroniser candidats et photos
        run: node scripts/sync-wikipedia.mjs
      - name: Parrainages (Conseil constitutionnel)
        run: node scripts/sync-parrainages.mjs
      - name: Liste officielle des candidats (Conseil constitutionnel)
        run: node scripts/sync-liste-officielle.mjs
      - name: Vérifier les données
        run: node scripts/check-data.mjs
      - name: Régénérer les pages
        run: node scripts/build-site.mjs
      - name: Commit
        run: |
          git config user.name "programmes-2027-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/ img/ index.html 404.html candidat candidats theme themes comparer signatures methodo sitemap.xml robots.txt manifest.webmanifest
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Synchro Wikipédia et parrainages du $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        id: commit
      - name: Republier le site (GitHub Pages, mode branche)
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true

